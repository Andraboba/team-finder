name: teamfinder

services:
  db:
    image: postgres:16
    env_file:
      - .env
    container_name: teamfinder_db
    ports:
      # Слева — порт на хосте (POSTGRES_PORT из .env), справа — порт в контейнере
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Django в контейнере (необязательно). Запускается только с профилем full:
  #   docker compose --profile full up -d --build
  web:
    build: .
    profiles: ["full"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "False"
      SERVE_MEDIA: "True"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8001}:8000"
    volumes:
      - media_data:/app/media
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
